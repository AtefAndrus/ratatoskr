[tools]
bun = "1.4.4"
"aqua:orhun/git-cliff" = "2.14.2"
# 本番調査の手順書 (.agents/skills/production-investigation) が管理 API の応答を読むのに使う
"aqua:jqlang/jq" = "1.8.2"

[settings]
env_file = ".env"

[tasks.setup]
description = "Install dependencies and initialize environment file"
run = ["bun install", "if [ ! -f .env ]; then cp .env.example .env; fi"]
