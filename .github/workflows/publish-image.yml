name: Publish image to GHCR

on:
  release:
    types: [published]
  # Release を作り直さずにイメージだけ出し直したいときに使う。タグは完全な SHA だけになる
  workflow_dispatch:

permissions: {}

# 存在確認から push までの間に別の実行が同じタグを書くと上書き防止が効かないため、実行を直列にする
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/atefandrus/ratatoskr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          # latest は付けない。デプロイ側は digest で固定するので、動くタグは誤った取り込みの元になるだけである
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,format=long,prefix=
      # GHCR はタグを書き換え不可にできないため、push 前に既存タグを確かめて上書きを防ぐ。
      # 「存在しない」以外の失敗 (認証やネットワーク) は存在を否定できないので、push せずに落とす。
      - name: Refuse to overwrite existing tags
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if out=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$ref" 2>&1); then
              echo "::error::$ref already exists ($out)"; exit 1
            fi
            case "$out" in
              *"$ref: not found") echo "$ref is free" ;;
              *) echo "::error::cannot confirm that $ref is absent: $out"; exit 1 ;;
            esac
          done <<< "$TAGS"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # storage record は organization 所有のリポジトリでしか作れず、このリポジトリはユーザー所有である
          create-storage-record: false
