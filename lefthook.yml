pre-commit:
  piped: true
  commands:
    # main へ直コミットすると push 前に気付いても reset とブランチ作り直しの往復になる。
    # 意図的に行う場合は LEFTHOOK=0 git commit ...
    00_guard-branch:
      run: |
        branch=$(git symbolic-ref --quiet --short HEAD || true)
        if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then exit 0; fi
        case "$branch" in
          main|master)
            echo "main への直コミットは既定で禁止。ブランチを切ること。"
            echo "意図的に行う場合は LEFTHOOK=0 git commit ..."
            exit 1 ;;
        esac
    01_format:
      run: bun run format:check
    02_lint:
      run: bun run lint
    03_lint-md:
      run: bun run lint:md
    04_typecheck:
      run: bun run typecheck
    # git はフックに GIT_INDEX_FILE を、linked worktree では絶対パスの GIT_DIR も渡す。
    # 残すと、テストが起動する git が -C の先ではなく作業中のリポジトリを書き換えるので、外してから動かす。
    05_test:
      run: |
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        bun test
